[tool.ruff]
# The venv runs the system Python 3.9. Without pinning this, ruff suggests
# 3.10+ idioms (e.g. RUF007 -> itertools.pairwise) that raise AttributeError at
# runtime. Raise this only when the interpreter is actually upgraded.
target-version = "py39"
line-length = 95

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PERF", "BLE", "ARG"]
ignore = [
    # This project's domain is Traditional Chinese government documents, so
    # full-width punctuation (：，（）) is the real content of the data, not a
    # homoglyph mistake. These three rules fire 78 times on correct code.
    "RUF001", "RUF002", "RUF003",
]

[project.optional-dependencies]
# 動態版所需；靜態版與分析管線不需要這些即可運作。
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 在執行期解析函式簽名；Python 3.9 無法 evaluate `X | None`，
# 端點參數必須寫成 Optional[X]，因此此檔不套用 UP045。
"src/smart_watchdog/api/server.py" = ["UP045"]
"src/smart_watchdog/api/scan.py" = ["UP045"]
"src/smart_watchdog/api/explore.py" = ["UP045"]
# Scripts prepend src/ to sys.path before importing the package, so their
# imports cannot sit at the top of the file.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # numpy 2.0.2 on Apple Accelerate emits spurious BLAS matmul warnings; a bare
    # np.random.rand(1213, 5) @ np.random.rand(5) reproduces them.
    "ignore:.*encountered in matmul:RuntimeWarning",
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
