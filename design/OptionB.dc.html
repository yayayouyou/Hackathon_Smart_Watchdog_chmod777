<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body{margin:0;background:#EFF3F5;color:#14202A;
      font-family:"IBM Plex Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
      font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:#3D4E5C}a:hover{color:#14202A}
    .mono{font-family:"IBM Plex Mono","PingFang TC",ui-monospace,monospace;font-variant-numeric:tabular-nums}
    .pod{background:#FFFFFFF2;border:1px solid #CFD9E0;border-radius:8px;
      box-shadow:0 1px 2px #14202a12, 0 6px 16px #14202a0e;padding:11px 13px}
    .podh{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600}
    .podn{margin-left:auto;font-size:11px;color:#6B7C8A}
  </style>
</helmet>

<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#E6EDF0">

  <!-- 地圖＝底層「世界」，一直在 -->
  <svg viewBox="0 0 1440 900" style="position:absolute;inset:0;width:100%;height:100%">
    <rect width="1440" height="900" fill="#E6EDF0"/>
    <path d="M300 180 L560 130 L790 210 L980 165 L1150 280 L1200 470 L1040 660 L810 770 L560 745 L370 620 L286 420 Z"
      fill="#DCA6A1" stroke="#243542" stroke-width="2.4"/>
    <path d="M560 130 L790 210 L784 400 L556 376 Z" fill="#C9756D" stroke="#ffffff99" stroke-width="1.2"/>
    <path d="M370 620 L560 745 L548 540 L386 508 Z" fill="#B23A2F" stroke="#ffffff99" stroke-width="1.2"/>
    <path d="M980 165 L1150 280 L1200 470 L1010 430 Z" fill="#ECCECB" stroke="#ffffff99" stroke-width="1.2"/>
    <g fill="#4A1D78"><circle cx="520" cy="500" r="8"/><circle cx="572" cy="556" r="8"/><circle cx="470" cy="560" r="8"/></g>
    <g fill="#9E72C0"><circle cx="640" cy="470" r="6.5"/><circle cx="700" cy="530" r="6.5"/><circle cx="440" cy="470" r="6.5"/></g>
    <g fill="#C8D0D7"><circle cx="760" cy="300" r="5"/><circle cx="900" cy="380" r="5"/><circle cx="420" cy="330" r="5"/>
      <circle cx="1050" cy="520" r="5"/><circle cx="860" cy="620" r="5"/><circle cx="640" cy="680" r="5"/></g>
    <g stroke="#B23A2F" stroke-width="2.6" fill="none">
      <circle cx="520" cy="500" r="17"/><circle cx="572" cy="556" r="17"/></g>
    <g font-size="15" fill="#24323C" letter-spacing="4" opacity=".85">
      <text x="596" y="268">淡水區</text><text x="440" y="596">板橋區</text><text x="1022" y="330">瑞芳區</text>
    </g>
  </svg>

  <!-- 上方功能列 -->
  <div style="position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;
    padding:11px 22px;background:#FFFFFFF2;border-bottom:1px solid #CFD9E0;backdrop-filter:blur(6px)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 9c0-1 .6-1.6 1.4-1.2L8 9h8l2.6-1.2C19.4 7.4 20 8 20 9v6.5c0 2.5-2 4.5-4.5 4.5h-7A4.5 4.5 0 0 1 4 15.5z"
        stroke="#B23A2F" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="9.5" cy="13" r="1.1" fill="#B23A2F"/><circle cx="14.5" cy="13" r="1.1" fill="#B23A2F"/>
    </svg>
    <div style="font-size:15px;font-weight:600">小小守護員</div>
    <div style="color:#6B7C8A;font-size:12px">新北市教保機構 · 建議查核優先序</div>
    <div style="margin-left:auto;display:flex;gap:18px;font-size:12px;color:#6B7C8A">
      <span>全市 <b class="mono" style="color:#14202A">1,213</b></span>
      <span>提案 <b class="mono" style="color:#14202A">20</b></span>
      <span>管道 <b class="mono" style="color:#14202A">4/6</b></span>
    </div>
  </div>

  <!-- 左側：可收合的功能 pod -->
  <div style="position:absolute;left:22px;top:74px;width:250px;display:flex;flex-direction:column;gap:12px">
    <div class="pod">
      <div class="podh">派工提案<span class="podn mono">20</span></div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;gap:7px;align-items:baseline;font-size:12px">
          <span class="mono" style="font-size:10px;color:#93A2AE">1</span>安溪非營利
          <span class="mono" style="margin-left:auto;font-size:10px;color:#6B7C8A">#856</span></div>
        <div style="display:flex;gap:7px;align-items:baseline;font-size:12px">
          <span class="mono" style="font-size:10px;color:#93A2AE">2</span>佳和非營利
          <span class="mono" style="margin-left:auto;font-size:10px;color:#6B7C8A">#887</span></div>
        <div style="display:flex;gap:7px;align-items:baseline;font-size:12px">
          <span class="mono" style="font-size:10px;color:#93A2AE">3</span>昌福非營利
          <span class="mono" style="margin-left:auto;font-size:10px;color:#6B7C8A">#74</span></div>
      </div>
    </div>
    <div class="pod">
      <div class="podh">輿論收集<span class="podn mono">31 則</span></div>
      <div style="margin-top:7px;display:flex;gap:4px;flex-wrap:wrap">
        <span style="font-size:10px;color:#2C7A5B;border:1px solid #2C7A5B;border-radius:9px;padding:1px 6px">新聞</span>
        <span style="font-size:10px;color:#2C7A5B;border:1px solid #2C7A5B;border-radius:9px;padding:1px 6px">PTT</span>
        <span style="font-size:10px;color:#93A2AE;border:1px dashed #CFD9E0;border-radius:9px;padding:1px 6px">Threads</span>
      </div>
    </div>
    <div class="pod">
      <div class="podh">資料提取存放<span class="podn mono">162 份</span></div>
      <div style="margin-top:7px;font-size:11.5px;color:#3D4E5C;line-height:1.6">
        非營利財報 132 · 決算書 30<br>
        <span style="color:#6B7C8A;font-size:10.5px">數字可回溯到頁碼</span></div>
    </div>
  </div>

  <!-- 右側：回測與建議書 -->
  <div style="position:absolute;right:22px;top:74px;width:250px;display:flex;flex-direction:column;gap:12px">
    <div class="pod">
      <div class="podh">回測成績</div>
      <div class="mono" style="margin-top:6px;font-size:24px;font-weight:500;line-height:1.1">2.29<span
        style="font-size:13px;color:#6B7C8A">×</span></div>
      <div style="font-size:10.5px;color:#6B7C8A">前 100 名命中率／隨機抽查 · AUC 0.658</div>
    </div>
    <div class="pod">
      <div class="podh">稽核建議書<span class="podn mono">143</span></div>
      <div style="margin-top:6px;font-size:11.5px;color:#3D4E5C">143／143 通過機械驗證</div>
    </div>
  </div>

  <!-- 地圖圖例 -->
  <div class="pod" style="position:absolute;left:22px;bottom:22px;width:186px">
    <div style="font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B7C8A;
      text-transform:uppercase">歷史裁罰件數</div>
    <div style="margin-top:7px;display:flex;flex-direction:column;gap:3px;font-size:11px;color:#3D4E5C">
      <div style="display:flex;align-items:center;gap:7px"><i style="width:15px;height:9px;
        border-radius:2px;background:#4A1D78;display:block"></i>7 件以上<span class="mono"
        style="margin-left:auto;color:#6B7C8A">46</span></div>
      <div style="display:flex;align-items:center;gap:7px"><i style="width:15px;height:9px;
        border-radius:2px;background:#9E72C0;display:block"></i>2–3 件<span class="mono"
        style="margin-left:auto;color:#6B7C8A">175</span></div>
      <div style="display:flex;align-items:center;gap:7px"><i style="width:15px;height:9px;
        border-radius:2px;background:#C8D0D7;display:block"></i>無紀錄<span class="mono"
        style="margin-left:auto;color:#6B7C8A">730</span></div>
    </div>
  </div>

  <!-- 守護犬蹲在地圖上，游標移動時牠跟著小跑 -->
  <div style="position:absolute;left:648px;top:432px">
    <svg width="54" height="50" viewBox="0 0 44 40" aria-hidden="true">
      <ellipse cx="22" cy="37" rx="12" ry="2.6" fill="#14202A" opacity=".16"/>
      <path d="M9 19c0-2.4 1.4-3.8 3.2-2.9L16 18h12l3.8-1.9C33.6 15.2 35 16.6 35 19v9c0 3.3-2.7 6-6 6H15c-3.3 0-6-2.7-6-6z"
        fill="#FFFFFF" stroke="#243542" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M11 17c-1.6-3.2-1.2-6.4.6-6.9 1.7-.5 3.6 1.4 4.4 4.3z" fill="#EFF3F5" stroke="#243542" stroke-width="1.5"/>
      <path d="M33 17c1.6-3.2 1.2-6.4-.6-6.9-1.7-.5-3.6 1.4-4.4 4.3z" fill="#EFF3F5" stroke="#243542" stroke-width="1.5"/>
      <circle cx="17.5" cy="24" r="1.7" fill="#243542"/><circle cx="26.5" cy="24" r="1.7" fill="#243542"/>
      <path d="M20.4 28.6h3.2" stroke="#243542" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="22" cy="26.6" r="1.5" fill="#B23A2F"/>
    </svg>
  </div>
  <div style="position:absolute;left:706px;top:428px;background:#FFFFFF;border:1px solid #CFD9E0;
    border-radius:14px 14px 14px 3px;padding:7px 12px;font-size:11.5px;color:#3D4E5C;
    box-shadow:0 1px 2px #14202a12, 0 6px 16px #14202a0e;max-width:214px;line-height:1.5">
    地圖永遠在底下，守護犬在上面跑。點 pod 時牠叼著那一格展開成全螢幕</div>

  <!-- 助理列 -->
  <div class="pod" style="position:absolute;right:22px;bottom:22px;width:330px;display:flex;
    align-items:center;gap:9px;padding:9px 12px">
    <span style="width:8px;height:8px;border-radius:50%;background:#2C7A5B;flex:none"></span>
    <div style="font-size:12px;color:#6B7C8A;flex:1">跟守護犬說一句話⋯⋯</div>
    <div style="border:1px solid #B23A2F;color:#B23A2F;border-radius:16px;padding:3px 12px;
      font-size:11.5px">送出</div>
  </div>
</div>
</x-dc>
</body>
</html>
